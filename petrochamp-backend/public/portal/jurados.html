<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Petrochamp — Painel dos Jurados</title>
<style>
  :root {
    --petro-primary: #7a1a2e;
    --petro-dark: #4a0f1c;
    --petro-gold: #d4a94b;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    margin: 0;
    min-height: 100vh;
    color: #1f2937;
    background-color: var(--petro-dark);
    background-image:
      linear-gradient(180deg, rgba(20,6,10,0.75) 0%, rgba(20,6,10,0.92) 100%),
      url('projecao-bg.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    padding: 32px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo {
    color: #fff;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 4px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .logo span { color: var(--petro-gold); }

  .tagline {
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    text-align: center;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .card {
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(6px);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    width: 100%;
    max-width: 440px;
    margin: 0 auto 16px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  h1 {
    color: var(--petro-primary);
    font-size: 19px;
    text-align: center;
    margin: 0 0 4px;
    font-weight: 700;
  }
  p.sub { text-align: center; color: #9ca3af; font-size: 13px; margin: 0 0 20px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label:first-of-type { margin-top: 0; }

  input, select {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    font-size: 15px;
    transition: border-color 0.15s;
    background: #fafafa;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--petro-primary);
    background: #fff;
  }
  input#codeInput { text-transform: uppercase; letter-spacing: 2px; font-weight: 700; text-align: center; }

  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--petro-primary), #5e1523);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 4px 14px rgba(122,26,46,0.35);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  .hidden { display: none !important; }

  .error-msg {
    color: #dc2626;
    font-size: 12px;
    text-align: center;
    margin-top: 12px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 8px;
  }

  .welcome {
    text-align: center;
    color: #fff;
    font-size: 13px;
    margin-bottom: 12px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .welcome b { color: var(--petro-gold); }

  .badge {
    display: inline-block;
    background: var(--petro-primary);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 5px 14px;
    border-radius: 9999px;
    margin-bottom: 14px;
  }

  .stagebadge {
    display: block;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--petro-primary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }

  .theme {
    text-align: center;
    color: #6b7280;
    font-size: 13px;
    margin: 0 0 18px;
  }

  .score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
    background: #fafafa;
    border: 1px solid #f0f0f0;
    border-radius: 12px;
    padding: 10px 14px;
  }
  .score-row span {
    font-size: 13px;
    color: #4b5563;
    font-weight: 500;
    flex: 1;
  }
  .score-row input {
    width: 74px;
    padding: 8px;
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    color: var(--petro-primary);
  }

  /* NOVO — cabeçalho e bloco de critério para a avaliação analítica.
     Cada critério mostra o nome do rótulo/pontuação máxima e dois
     inputs lado a lado (Equipa A e Equipa B), em vez da antiga
     "nota única" por equipa. */
  .criteria-block {
    background: #fafafa;
    border: 1px solid #f0f0f0;
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .criteria-block .criteria-label {
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 8px;
  }
  .criteria-block .criteria-max {
    color: #9ca3af;
    font-weight: 400;
    font-size: 11px;
  }
  .criteria-teams {
    display: flex;
    gap: 10px;
  }
  .criteria-team-input {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .criteria-team-input span {
    font-size: 11px;
    color: #9ca3af;
    text-align: center;
  }
  .criteria-team-input input {
    width: 100%;
    text-align: center;
    font-weight: 700;
    color: var(--petro-primary);
  }

  .waiting {
    text-align: center;
    font-size: 13px;
    color: #9ca3af;
    padding: 28px 10px;
    line-height: 1.5;
  }

  .status {
    text-align: center;
    font-size: 13px;
    color: #16a34a;
    font-weight: 700;
    margin-top: 14px;
  }

  .team-title {
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    color: var(--petro-primary);
    margin-bottom: 2px;
  }
</style>
</head>
<body>

  <div class="logo">PETRO<span>CHAMP</span></div>
  <div class="tagline">Painel Remoto dos Jurados</div>

  <div id="registerCard" class="card">
    <h1>Identificação do Jurado</h1>
    <p class="sub">Insere o teu nome e o código dado pelo Administrador</p>

    <label for="nameInput">Nome</label>
    <input id="nameInput" type="text" placeholder="O teu nome" autocomplete="name" />

    <label for="codeInput">Código (4 dígitos)</label>
    <input id="codeInput" type="text" placeholder="0000" inputmode="numeric" maxlength="4" />

    <button id="registerBtn">Entrar</button>
    <p id="registerError" class="error-msg hidden"></p>
  </div>

  <!-- ===== MODO BATALHA (Quiz) ===== -->
  <div id="quizCard" class="card hidden">
    <div class="badge" id="phaseLabel">Fase</div>
    <div class="team-title" id="matchTitle">A aguardar equipas...</div>
    <div id="mcItemsArea"></div>
    <div id="analyticArea" style="margin-top: 16px;"></div>
    <button id="submitBtn">Confirmar Avaliação</button>
    <p id="submitStatus" class="status"></p>
  </div>

  <!-- ===== MODO APRESENTAÇÃO DE PROJETOS ===== -->
  <div id="presentationCard" class="card hidden">
    <div class="badge" id="presPhaseLabel">Fase</div>
    <span class="stagebadge" id="presStageLabel"></span>
    <div class="team-title" id="presTeamName">A aguardar apresentação...</div>
    <p class="theme" id="presTheme"></p>
    <div id="presWaiting" class="waiting hidden"></div>
    <div id="presNoCriteria" class="waiting hidden">Nenhum critério cadastrado para esta fase.</div>
    <div id="presScoreArea"></div>
    <button id="presSubmitBtn" class="hidden">Confirmar Avaliação</button>
    <p id="presSubmitStatus" class="status"></p>
  </div>

  <p id="welcomeMsg" class="welcome hidden"></p>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
  const backendUrl = `http://${window.location.hostname}:4000`
  const socket = io(backendUrl, { transports: ['polling', 'websocket'] })

  let jurorId = null
  let jurorName = null
  let state = null

  // ---- Modo Batalha (Quiz) ----
  let evaluationItems = []
  let multipleChoiceItems = []
  // NOVO — o sistema de avaliação de perguntas analíticas passou a usar
  // sempre critérios (label + pontuação máxima por critério, por
  // equipa), tal como o backend já espera via os eventos
  // juror:setAnalyticCriteriaScore / juror:submitAnalyticEvaluation e o
  // estado state.analyticEvaluation. O antigo sistema de "nota única"
  // (juror:setScore / jurorEntries) foi removido deste painel: era o
  // que causava "processa e volta a pedir nota" em perguntas que já
  // tinham critérios cadastrados — o jurado enviava uma nota genérica
  // que o backend nunca chegava a contar para o estado de critérios,
  // por isso a pergunta nunca ficava marcada como avaliada e o painel
  // continuava a mostrar o formulário.
  //
  // O painel já não deixa escolher livremente qualquer pergunta da
  // fase (o antigo <select> permitia "pré-avaliar" perguntas que ainda
  // nem tinham sido sorteadas) — em vez disso, segue sempre a pergunta
  // analítica que está a decorrer neste momento
  // (state.currentAnalyticItemId), que é também a única que o backend
  // aceita em juror:submitAnalyticEvaluation (compara com
  // state.analyticEvaluation.itemId). Isto elimina outra fonte
  // possível do mesmo bug: enviar notas para uma pergunta diferente da
  // que o servidor está de facto à espera.
  let criteriaCache = {} // itemId -> array de critérios
  let criteriaFetchedForItem = null
  let lastRenderedItemId = null

  function showError(msg) {
    const el = document.getElementById('registerError')
    el.textContent = msg
    el.classList.remove('hidden')
  }

  document.getElementById('registerBtn').onclick = () => {
    const name = document.getElementById('nameInput').value.trim()
    const code = document.getElementById('codeInput').value.trim().toUpperCase()
    document.getElementById('registerError').classList.add('hidden')

    if (!name) { showError('Introduz o teu nome.'); return }
    if (!code) { showError('Introduz o código de jurado.'); return }

    socket.emit('juror:register', { code }, (res) => {
      if (!res.success) {
        showError(res.error)
        return
      }
      jurorId = res.jurorId
      jurorName = name
      document.getElementById('registerCard').classList.add('hidden')
      const welcome = document.getElementById('welcomeMsg')
      welcome.innerHTML = `Bem-vindo(a), <b>${jurorName}</b>`
      welcome.classList.remove('hidden')
      render()
    })
  }

  socket.on('state:sync', async (incoming) => {
    state = incoming
    if (jurorId === null) return
    await resolveCurrentPhase()
    render()
  })

  // ---- Modo Apresentação ----
  let phasesCache = {}
  let criteriaCachePresentation = {}
  let currentPhaseRecord = null

  const presentationScoreDebounce = {}
  const PRESENTATION_SCORE_DEBOUNCE_MS = 400
  const analyticScoreDebounce = {}
  const ANALYTIC_SCORE_DEBOUNCE_MS = 400

  async function resolveCurrentPhase() {
    if (!state?.championship) {
      currentPhaseRecord = null
      return
    }
    if (!phasesCache[state.championship]) {
      try {
        const res = await fetch(`${backendUrl}/api/phases?championship=${state.championship}`)
        phasesCache[state.championship] = await res.json()
      } catch {
        phasesCache[state.championship] = []
      }
    }
    const phases = phasesCache[state.championship]
    currentPhaseRecord = phases.find((p) => p.order === state.phase) ?? null
  }

  async function loadCriteriaPresentation(phaseId) {
    if (criteriaCachePresentation[phaseId]) return criteriaCachePresentation[phaseId]
    try {
      const res = await fetch(`${backendUrl}/api/presentation/criteria?phaseId=${phaseId}`)
      const data = await res.json()
      criteriaCachePresentation[phaseId] = data
      return data
    } catch {
      return []
    }
  }

  function isPresentationPhase() {
    return currentPhaseRecord?.type === 'apresentacao' || currentPhaseRecord?.type === 'apresentacao_quiz'
  }

  function isEditingPresentationScore() {
    const active = document.activeElement
    return !!active && active.classList?.contains('pres-score-input')
  }

  async function render() {
    if (jurorId === null || !state) return

    document.getElementById('quizCard').classList.add('hidden')
    document.getElementById('presentationCard').classList.add('hidden')

    if (isPresentationPhase()) {
      document.getElementById('presentationCard').classList.remove('hidden')
      if (!isEditingPresentationScore()) {
        await renderPresentation()
      }
    } else if (state.teamA && state.teamB) {
      document.getElementById('quizCard').classList.remove('hidden')
      document.getElementById('phaseLabel').textContent = `Fase ${state.phase}`
      const teamA = state.teamA?.name ?? '?'
      const teamB = state.teamB?.name ?? '?'
      document.getElementById('matchTitle').textContent = `${teamA} vs ${teamB}`
      await fetchQuizItems(state.phase)
      await renderAnalyticArea()
    } else {
      document.getElementById('quizCard').classList.remove('hidden')
      document.getElementById('phaseLabel').textContent = `Fase ${state.phase}`
      document.getElementById('matchTitle').textContent = 'A aguardar equipas...'
      document.getElementById('mcItemsArea').innerHTML = ''
      document.getElementById('analyticArea').innerHTML = ''
      document.getElementById('submitBtn').classList.add('hidden')
    }
  }

  // ==================== MODO BATALHA (Quiz) ====================

  let quizItemsFetchedForPhase = null

  async function fetchQuizItems(phase) {
    if (quizItemsFetchedForPhase !== phase) {
      const res = await fetch(`${backendUrl}/api/evaluation-items?phase=${phase}`)
      evaluationItems = await res.json()
      multipleChoiceItems = evaluationItems.filter((i) => i.mode === 'multipla_escolha')
      quizItemsFetchedForPhase = phase
    }
  }

  function jurorsAllowedFor(item) {
    if (!item || !item.jurorIds || item.jurorIds.length === 0) return true
    return item.jurorIds.includes(jurorId)
  }

  async function loadCriteriaAnalytic(itemId) {
    if (criteriaCache[itemId]) return criteriaCache[itemId]
    try {
      const res = await fetch(`${backendUrl}/api/evaluation-criteria?itemId=${encodeURIComponent(itemId)}`)
      const data = await res.json()
      criteriaCache[itemId] = data
      return data
    } catch {
      return []
    }
  }

  // NOVO — mesmo princípio do isEditingPresentationScore: não
  // reconstrói os campos de nota enquanto o jurado tem o foco neles.
  function isEditingAnalyticScore() {
    const active = document.activeElement
    return !!active && active.classList?.contains('analytic-score-input')
  }

  async function renderAnalyticArea() {
    if (isEditingAnalyticScore()) return

    const mcArea = document.getElementById('mcItemsArea')
    if (mcArea) {
      mcArea.innerHTML = multipleChoiceItems.length
        ? multipleChoiceItems
            .map(
              (i) => `    <div class="score-row">      <span>${i.text} (${i.timeSeconds ?? 30}s · ${i.maxPoints} pts)</span>      ${state?.currentAnalyticItemId === i.id ? '<span style="color:#d97706;font-weight:700;font-size:11px;">EM CURSO</span>' : ''}    </div>  `
            )
            .join('')
        : ''
    }

    const analyticArea = document.getElementById('analyticArea')
    const submitBtn = document.getElementById('submitBtn')
    const statusEl = document.getElementById('submitStatus')

    // Só há algo para avaliar quando existe uma pergunta analítica
    // ('aberta') atualmente sorteada. Perguntas de escolha múltipla são
    // respondidas pelas equipas nos ecrãs delas, não pelos jurados.
    const hasActiveAnalytic =
      state?.currentItemSource === 'analytic' &&
      state?.currentItemMode === 'aberta' &&
      state?.currentAnalyticItemId

    if (!hasActiveAnalytic) {
      analyticArea.innerHTML = ''
      submitBtn.classList.add('hidden')
      statusEl.textContent = ''
      lastRenderedItemId = null
      return
    }

    const itemId = state.currentAnalyticItemId
    const item = evaluationItems.find((i) => i.id === itemId)

    if (!jurorsAllowedFor(item)) {
      analyticArea.innerHTML =
        '<p style="font-size:12px;color:#9ca3af;text-align:center;">Esta pergunta está reservada a outros jurados.</p>'
      submitBtn.classList.add('hidden')
      statusEl.textContent = ''
      return
    }

    if (criteriaFetchedForItem !== itemId) {
      await loadCriteriaAnalytic(itemId)
      criteriaFetchedForItem = itemId
    }
    const criteria = criteriaCache[itemId] ?? []

    if (!criteria.length) {
      analyticArea.innerHTML =
        '<p style="font-size:12px;color:#9ca3af;text-align:center;">Nenhum critério cadastrado para esta pergunta.</p>'
      submitBtn.classList.add('hidden')
      return
    }

    const analyticEval = state.analyticEvaluation
    const alreadySubmitted =
      analyticEval?.itemId === itemId && analyticEval.jurorsSubmitted.includes(jurorId)

    if (lastRenderedItemId !== itemId) {
      analyticArea.innerHTML = criteria
        .map((c) => {
          const entryA = analyticEval?.itemId === itemId
            ? analyticEval.criteriaScores.find((e) => e.jurorId === jurorId && e.criteriaId === c.id && e.team === 'A')
            : null
          const entryB = analyticEval?.itemId === itemId
            ? analyticEval.criteriaScores.find((e) => e.jurorId === jurorId && e.criteriaId === c.id && e.team === 'B')
            : null
          return `
            <div class="criteria-block">
              <div class="criteria-label">${c.label} <span class="criteria-max">(máx. ${c.maxPoints})</span></div>
              <div class="criteria-teams">
                <div class="criteria-team-input">
                  <span>${state.teamA?.name ?? 'Equipa A'}</span>
                  <input
                    class="analytic-score-input"
                    data-criteria-id="${c.id}"
                    data-team="A"
                    data-max="${c.maxPoints}"
                    type="number" min="0" max="${c.maxPoints}"
                    value="${entryA?.score ?? 0}"
                    ${alreadySubmitted ? 'disabled' : ''}
                  />
                </div>
                <div class="criteria-team-input">
                  <span>${state.teamB?.name ?? 'Equipa B'}</span>
                  <input
                    class="analytic-score-input"
                    data-criteria-id="${c.id}"
                    data-team="B"
                    data-max="${c.maxPoints}"
                    type="number" min="0" max="${c.maxPoints}"
                    value="${entryB?.score ?? 0}"
                    ${alreadySubmitted ? 'disabled' : ''}
                  />
                </div>
              </div>
            </div>
          `
        })
        .join('')

      analyticArea.querySelectorAll('.analytic-score-input').forEach((input) => {
        input.oninput = (e) => {
          const criteriaId = e.target.dataset.criteriaId
          const team = e.target.dataset.team
          const max = Number(e.target.dataset.max)
          let score = Number(e.target.value)
          if (Number.isNaN(score)) score = 0
          score = Math.max(0, Math.min(max, score))

          const key = `${jurorId}::${criteriaId}::${team}`
          if (analyticScoreDebounce[key]) clearTimeout(analyticScoreDebounce[key])
          analyticScoreDebounce[key] = setTimeout(() => {
            socket.emit('juror:setAnalyticCriteriaScore', { jurorId, criteriaId, team, score })
            delete analyticScoreDebounce[key]
          }, ANALYTIC_SCORE_DEBOUNCE_MS)
        }
      })

      lastRenderedItemId = itemId
    }

    submitBtn.classList.remove('hidden')
    submitBtn.disabled = alreadySubmitted
    statusEl.textContent = alreadySubmitted ? 'Avaliação enviada ✓' : ''
  }

  document.getElementById('submitBtn').onclick = () => {
    if (!jurorId || !state?.currentAnalyticItemId) return
    socket.emit('juror:submitAnalyticEvaluation', { jurorId, itemId: state.currentAnalyticItemId })
    document.getElementById('submitStatus').textContent = 'Avaliação enviada ✓'
  }

  // ==================== MODO APRESENTAÇÃO DE PROJETOS ====================

  const stageLabels = {
    idle: 'A aguardar o Moderador',
    countdown: 'A preparar a apresentação...',
    presenting: 'Em apresentação',
    concluded: 'Apresentação concluída — a avaliar'
  }

  async function renderPresentation() {
    const flow = state.presentationFlow
    document.getElementById('presPhaseLabel').textContent = `Fase ${state.phase}`
    document.getElementById('presStageLabel').textContent = stageLabels[flow.stage] ?? ''
    document.getElementById('presTeamName').textContent = flow.teamName ?? 'A aguardar apresentação...'
    document.getElementById('presTheme').textContent = flow.theme ? `Tema: ${flow.theme}` : ''

    const waitingEl = document.getElementById('presWaiting')
    const noCriteriaEl = document.getElementById('presNoCriteria')
    const scoreAreaEl = document.getElementById('presScoreArea')
    const submitBtn = document.getElementById('presSubmitBtn')
    const statusEl = document.getElementById('presSubmitStatus')

    waitingEl.classList.add('hidden')
    noCriteriaEl.classList.add('hidden')
    submitBtn.classList.add('hidden')
    scoreAreaEl.innerHTML = ''
    statusEl.textContent = ''

    if (flow.stage === 'idle') {
      waitingEl.classList.remove('hidden')
      waitingEl.textContent = 'A aguardar o Moderador iniciar a apresentação de uma equipa.'
      return
    }

    if (flow.stage !== 'concluded') {
      waitingEl.classList.remove('hidden')
      waitingEl.textContent = 'A avaliação fica disponível assim que o Moderador finalizar a apresentação desta equipa.'
      return
    }

    if (!currentPhaseRecord) return
    const criteria = await loadCriteriaPresentation(currentPhaseRecord.id)
    if (!criteria.length) {
      noCriteriaEl.classList.remove('hidden')
      return
    }

    const alreadySubmitted = flow.jurorsSubmitted.includes(jurorId)

    scoreAreaEl.innerHTML = criteria
      .map((c) => {
        const entry = flow.criteriaScores.find((e) => e.jurorId === jurorId && e.criteriaId === c.id)
        return `
          <div class="score-row">
            <span>${c.label} (máx. ${c.maxPoints})</span>
            <input
              class="pres-score-input"
              data-criteria-id="${c.id}"
              data-max="${c.maxPoints}"
              type="number" min="0" max="${c.maxPoints}"
              value="${entry?.score ?? 0}"
              ${alreadySubmitted ? 'disabled' : ''}
            />
          </div>
        `
      })
      .join('')

    scoreAreaEl.querySelectorAll('.pres-score-input').forEach((input) => {
      input.oninput = (e) => {
        const criteriaId = e.target.dataset.criteriaId
        const max = Number(e.target.dataset.max)
        let score = Number(e.target.value)
        if (Number.isNaN(score)) score = 0
        score = Math.max(0, Math.min(max, score))

        const key = `${jurorId}::${criteriaId}`
        if (presentationScoreDebounce[key]) clearTimeout(presentationScoreDebounce[key])
        presentationScoreDebounce[key] = setTimeout(() => {
          socket.emit('juror:setPresentationScore', { jurorId, criteriaId, score })
          delete presentationScoreDebounce[key]
        }, PRESENTATION_SCORE_DEBOUNCE_MS)
      }
    })

    if (alreadySubmitted) {
      statusEl.textContent = 'Avaliação enviada ✓'
    } else {
      submitBtn.classList.remove('hidden')
    }
  }

  document.getElementById('presSubmitBtn').onclick = () => {
    if (!jurorId) return
    socket.emit('juror:submitPresentationEvaluation', { jurorId })
    document.getElementById('presSubmitStatus').textContent = 'Avaliação enviada ✓'
    document.getElementById('presSubmitBtn').classList.add('hidden')
  }
</script>
</body>
</html>
