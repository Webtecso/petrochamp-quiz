workflows:
  ios-capacitor-test:
    name: Petrochamp Quiz - iOS Test Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web assets (sem typecheck — só para gerar o bundle)
        script: |
          npx electron-vite build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Resolve Swift Package Manager dependencies
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App
      - name: Build unsigned .ipa (ad-hoc via Codemagic default signing)
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive
      - name: Export unsigned IPA manually
        script: |
          mkdir -p $CM_BUILD_DIR/export
          mkdir -p $CM_BUILD_DIR/export/Payload
          cp -r $CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app $CM_BUILD_DIR/export/Payload/
          cd $CM_BUILD_DIR/export
          zip -r App-unsigned.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/export/App-unsigned.ipa
      - ios/App/build/**/*.ipa
